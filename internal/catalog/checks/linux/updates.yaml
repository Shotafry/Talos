checks:
  - id: UPD-01
    category: UPDATES
    os: linux
    tier: core
    description: "Comprueba que no queden parches de seguridad sin instalar. Cada actualización pendiente suele tapar una vulnerabilidad conocida, y dejarlas acumular es una de las vías de intrusión más comunes."
    read: { type: pkgmgr, op: "security", cmd: ["apt", "list", "--upgradable"] }
    comparator: le
    expected: { good: "0", medium: "5" }
    points: 5
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { package: apt }
    requiresPrivilege: false
    remediation: "Actualiza el índice de paquetes y aplica los parches con `apt-get update && apt-get upgrade`; valora habilitar las actualizaciones de seguridad automáticas (unattended-upgrades)."
    ensControls: ["op.exp.4"]
    syntaxConfidence: review

  - id: UPD-02
    category: UPDATES
    os: linux
    tier: deep
    description: "Comprueba si el sistema marcó un reinicio pendiente (fichero /run/reboot-required). Algunos parches, sobre todo los del kernel, no surten efecto hasta reiniciar, por lo que el equipo sigue vulnerable mientras tanto."
    read: { type: stat, path: "/run/reboot-required" }
    comparator: exists
    expected: { good: false }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Programa un reinicio en una ventana de mantenimiento para aplicar los parches pendientes; si necesitas evitar el reinicio, valora el parcheo del kernel en caliente (livepatch/kpatch)."
    ensControls: ["op.exp.4"]
    syntaxConfidence: high

  # (2026.08.1) La ACTUALIZACION AUTOMATICA de seguridad. El catalogo sabia decir si quedaban
  # parches pendientes (UPD-01) y si hacia falta reiniciar (UPD-02), pero no si el equipo se
  # actualiza SOLO. Es la diferencia entre enterarse de la deuda y no volver a contraerla, y en una
  # flota que nadie parchea a mano cada semana es la unica que aguanta.
  - id: UPD-03
    category: UPDATES
    os: linux
    tier: core
    description: "Comprueba si el equipo instala por su cuenta las actualizaciones de seguridad. Sin esto, cada parche depende de que alguien se acuerde, y la ventana entre que un fallo se hace público y se corrige en este equipo se mide en semanas."
    read: { type: exec, cmd: ["sh", "-c", "systemctl is-enabled unattended-upgrades.service dnf-automatic.timer dnf-automatic-install.timer yum-cron.service 2>/dev/null | grep -c enabled"] }
    comparator: ge
    expected: { good: "1" }
    points: 3
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "En Debian y Ubuntu, instala `unattended-upgrades` y actívalo con `dpkg-reconfigure -plow unattended-upgrades`. En RHEL y derivados, instala `dnf-automatic` y habilita `dnf-automatic-install.timer`."
    ensControls: ["op.exp.4"]
    syntaxConfidence: review
