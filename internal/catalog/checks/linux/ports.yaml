  - id: PORTS-2375
    category: PORTS
    os: linux
    tier: deep
    description: "La API de Docker sin TLS (2375) da control total del host; nunca debe escuchar en red."
    read: { type: ss, key: "2375" }
    comparator: exists
    expected: { good: false }
    points: 4
    severity: critical
    criticality: CRITICA
    requiresPrivilege: false
    remediation: "No expongas el socket TCP de Docker; usa el socket unix o TLS mutuo."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: PORTS-EXPOSE
    category: PORTS
    os: linux
    tier: deep
    description: "Los servicios de base de datos no deben escuchar en 0.0.0.0/[::] (exposición pública)."
    read: { type: ss }
