    syntaxConfidence: high

  - id: PORTS-3389
    category: PORTS
    os: linux
    tier: deep
    description: "RDP (3389/tcp) raramente debe escuchar en un servidor Linux."
    read: { type: ss, key: "3389" }
    comparator: exists
    expected: { good: false }
    points: 2
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Desactiva el servicio RDP (xrdp) si no es necesario; usa SSH."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: PORTS-6379
    category: PORTS
    os: linux
    tier: deep
    description: "Redis (6379) no debe estar a la escucha en red sin autenticación."
    read: { type: ss, key: "6379" }
    comparator: exists
    expected: { good: false }
    points: 3
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Vincula Redis a 127.0.0.1 y exige contraseña; nunca expuesto sin auth."
    ensControls: ["mp.com.4", "op.exp.2"]
    syntaxConfidence: high

  - id: PORTS-9200
    category: PORTS
    os: linux
    tier: deep
    description: "Elasticsearch (9200) no debe exponerse sin autenticación."
    read: { type: ss, key: "9200" }
    comparator: exists
    expected: { good: false }
    points: 2
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Vincula Elasticsearch a la red interna y activa seguridad/auth."
