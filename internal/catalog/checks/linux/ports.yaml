checks:
  - id: PORTS-23
    category: PORTS
    os: linux
    tier: core
    description: "Telnet (23/tcp) no debe estar a la escucha: transmite credenciales en claro."
    read: { type: ss, key: "23" }
    comparator: exists
    expected: { good: false }
    points: 5
    severity: critical
    criticality: CRITICA
    requiresPrivilege: false
    remediation: "Desinstala telnetd (`apt purge telnetd`) y usa SSH."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: PORTS-21
    category: PORTS
    os: linux
    tier: core
    description: "FTP (21/tcp) transmite credenciales en claro; usa SFTP/FTPS."
    read: { type: ss, key: "21" }
    comparator: exists
    expected: { good: false }
    points: 4
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Sustituye FTP por SFTP/FTPS y detén el servicio FTP en claro."
    ensControls: ["mp.com.1", "mp.com.2"]
    syntaxConfidence: high

  - id: PORTS-2049
    category: PORTS
    os: linux
    tier: deep
    description: "NFS (2049/tcp) no debería exponerse salvo necesidad y con control de acceso."
    read: { type: ss, key: "2049" }
    comparator: exists
    expected: { good: false }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Restringe NFS a la red interna o desactivalo si no se usa."
