checks:
  - id: MAC-01
    category: MAC
    os: linux
    tier: core
    description: "SELinux aplica control de acceso obligatorio: confina cada proceso a lo que tiene permitido y limita el daño si uno se ve comprometido. En modo Enforcing las políticas se aplican de verdad; en Permissive solo se registran sin bloquear nada."
    read: { type: exec, cmd: ["getenforce"] }
    comparator: eq
    expected: { good: "Enforcing", medium: "Permissive" }
    points: 4
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { file: "/etc/selinux/config" }
    requiresPrivilege: false
    remediation: "Fija `SELINUX=enforcing` en /etc/selinux/config y reinicia; antes conviene pasar un tiempo en Permissive revisando los registros para no romper servicios al activarlo."
    ensControls: ["op.exp.2", "op.acc.2"]
    syntaxConfidence: high

  - id: MAC-02
    category: MAC
    os: linux
    tier: core
    description: "AppArmor es el control de acceso obligatorio basado en perfiles por aplicación, que restringe lo que cada programa puede tocar. No basta con tenerlo cargado: los perfiles deben estar en modo enforce para que realmente bloqueen, no solo registren."
    read: { type: exec, cmd: ["aa-status"] }
    comparator: regex
    expected: { good: "profiles are in enforce mode" }
    points: 4
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { package: apparmor }
    requiresPrivilege: true
    remediation: "Instala y activa AppArmor (`systemctl enable --now apparmor`) y pon los perfiles en modo enforce con `aa-enforce` en lugar de dejarlos en complain."
    ensControls: ["op.exp.2", "op.acc.2"]
    syntaxConfidence: review
