  - id: KRNL-14
    category: KERNEL
    os: linux
    tier: deep
    description: "suid_dumpable a 0 evita volcados de memoria de binarios SUID (pueden filtrar secretos)."
    read: { type: sysctl, key: "fs.suid_dumpable" }
    comparator: eq
    expected: { good: "0" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `fs.suid_dumpable = 0` en sysctl."
