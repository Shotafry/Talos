    expected: { good: "1", medium: "2" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `kernel.unprivileged_bpf_disabled = 1` en sysctl."
    ensControls: ["op.exp.2"]
