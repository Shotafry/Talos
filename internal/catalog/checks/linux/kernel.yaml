  - id: KRNL-15
    category: KERNEL
    os: linux
    tier: deep
    description: "Deshabilitar BPF para usuarios sin privilegios reduce superficie de exploits del kernel."
    read: { type: sysctl, key: "kernel.unprivileged_bpf_disabled" }
