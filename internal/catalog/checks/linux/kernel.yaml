    category: KERNEL
    os: linux
    tier: deep
    description: "dmesg_restrict impide a usuarios sin privilegios leer el buffer del kernel."
    read: { type: sysctl, key: "kernel.dmesg_restrict" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `kernel.dmesg_restrict = 1` en sysctl."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-11
    category: KERNEL
    os: linux
    tier: deep
    description: "yama ptrace_scope limita que un proceso depure a otro (mitiga robo de credenciales)."
    read: { type: sysctl, key: "kernel.yama.ptrace_scope" }
