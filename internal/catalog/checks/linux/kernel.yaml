checks:
  - id: KRNL-01
    category: KERNEL
    os: linux
    tier: core
    description: "ASLR coloca en direcciones de memoria aleatorias el código y los datos de cada proceso. Al máximo (2) le quita al atacante la previsibilidad que necesitan muchos exploits de corrupción de memoria."
    read: { type: sysctl, key: "kernel.randomize_va_space" }
    comparator: eq
    expected: { good: "2", medium: "1" }
    points: 5
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Crea /etc/sysctl.d/60-talos.conf con `kernel.randomize_va_space = 2` y aplícalo con `sysctl --system`. El valor 1 solo aleatoriza parcialmente; usa 2."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-02
    category: KERNEL
    os: linux
    tier: core
    description: "Las SYN cookies permiten al servidor seguir aceptando conexiones legítimas durante una inundación SYN (un DoS clásico que agota la cola de conexiones a medio abrir)."
    read: { type: sysctl, key: "net.ipv4.tcp_syncookies" }
    comparator: eq
    expected: { good: "1" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.tcp_syncookies = 1` en /etc/sysctl.d/ y aplica con `sysctl --system`."
    ensControls: ["mp.s.4", "op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-03
    category: KERNEL
    os: linux
    tier: core
    description: "Aceptar redirecciones ICMP deja que un equipo de la red reescriba tu tabla de rutas y desvíe tu tráfico hacia él (man-in-the-middle). Un servidor no debería aceptarlas."
    read: { type: sysctl, key: "net.ipv4.conf.all.accept_redirects" }
    comparator: eq
    expected: { good: "0" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.accept_redirects = 0` (y la variante `.default`) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-04
    category: KERNEL
    os: linux
    tier: deep
    description: "Igual que la anterior pero para las interfaces de red que se creen en el futuro (valor por defecto): tampoco deben aceptar redirecciones ICMP."
    read: { type: sysctl, key: "net.ipv4.conf.default.accept_redirects" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.default.accept_redirects = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-05
    category: KERNEL
    os: linux
    tier: deep
    description: "Solo un router debe enviar redirecciones ICMP. En un servidor normal, enviarlas filtra información de la topología de red y no aporta nada."
    read: { type: sysctl, key: "net.ipv4.conf.all.send_redirects" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.send_redirects = 0` (y `.default`) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-06
    category: KERNEL
    os: linux
    tier: core
    description: "El filtrado de ruta inversa descarta paquetes cuya dirección de origen no podría haber llegado por esa interfaz, lo que frena el spoofing de IP de origen."
    read: { type: sysctl, key: "net.ipv4.conf.all.rp_filter" }
    comparator: in
    expected: { good: ["1", "2"] }
    points: 2
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.rp_filter = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: review

  - id: KRNL-07
    category: KERNEL
    os: linux
    tier: deep
    description: "El enrutado por origen deja que quien envía el paquete imponga la ruta de vuelta, lo que permite eludir cortafuegos y suplantar direcciones. No debe aceptarse."
    read: { type: sysctl, key: "net.ipv4.conf.all.accept_source_route" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.accept_source_route = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-08
    category: KERNEL
    os: linux
    tier: deep
    description: "Ignorar los pings dirigidos a la dirección de broadcast evita que tu equipo amplifique un ataque ICMP (smurf) contra una víctima."
    read: { type: sysctl, key: "net.ipv4.icmp_echo_ignore_broadcasts" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.icmp_echo_ignore_broadcasts = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["mp.s.4", "op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-09
    category: KERNEL
    os: linux
    tier: core
    description: "kptr_restrict oculta las direcciones internas del kernel en /proc a los usuarios sin privilegios. Conocer esas direcciones es el primer paso de muchos exploits del kernel."
    read: { type: sysctl, key: "kernel.kptr_restrict" }
    comparator: in
    expected: { good: ["1", "2"] }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `kernel.kptr_restrict = 1` (o 2) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-10
    category: KERNEL
    os: linux
    tier: deep
    description: "dmesg_restrict impide que un usuario sin privilegios lea el buffer del kernel (dmesg), que suele filtrar direcciones de memoria y pistas útiles para escalar privilegios."
    read: { type: sysctl, key: "kernel.dmesg_restrict" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `kernel.dmesg_restrict = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-11
    category: KERNEL
    os: linux
    tier: deep
    description: "ptrace permite a un proceso inspeccionar y depurar a otro. Restringirlo con Yama evita que un proceso comprometido vuelque la memoria de otros y robe credenciales o claves."
    read: { type: sysctl, key: "kernel.yama.ptrace_scope" }
    comparator: ge
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `kernel.yama.ptrace_scope = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-12
    category: KERNEL
    os: linux
    tier: deep
    description: "Protege frente a ataques con enlaces duros (hardlinks) en directorios compartidos: el kernel solo los sigue si quien lo hace es dueño del fichero, cortando una vía de escalada."
    read: { type: sysctl, key: "fs.protected_hardlinks" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `fs.protected_hardlinks = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-13
    category: KERNEL
    os: linux
    tier: deep
    description: "Protege frente a ataques con enlaces simbólicos en directorios world-writable con sticky bit (como /tmp), un truco habitual para que un proceso privilegiado escriba donde no debe."
    read: { type: sysctl, key: "fs.protected_symlinks" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `fs.protected_symlinks = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-14
    category: KERNEL
    os: linux
    tier: deep
    description: "Si un binario SUID (que corre como root) se cae y vuelca su memoria, ese volcado puede contener secretos. Con suid_dumpable a 0 esos volcados no se generan."
    read: { type: sysctl, key: "fs.suid_dumpable" }
    comparator: eq
    expected: { good: "0" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `fs.suid_dumpable = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-15
    category: KERNEL
    os: linux
    tier: deep
    description: "BPF es muy potente y ha sido origen de varios exploits del kernel. Bloquearlo para usuarios sin privilegios reduce esa superficie de ataque sin afectar al uso normal."
    read: { type: sysctl, key: "kernel.unprivileged_bpf_disabled" }
    comparator: eq
    expected: { good: "1", medium: "2" }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Pon `kernel.unprivileged_bpf_disabled = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-16
    category: KERNEL
    os: linux
    tier: deep
    description: "Registrar los paquetes con direcciones de origen imposibles (martians) deja rastro de intentos de spoofing en los logs, útil para detectar reconocimiento y ataques de red."
    read: { type: sysctl, key: "net.ipv4.conf.all.log_martians" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.log_martians = 1` (y `.default`) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.8", "op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-17
    category: KERNEL
    os: linux
    tier: deep
    description: "El filtrado de ruta inversa, también para las interfaces que se creen en el futuro (valor por defecto): mantiene la protección anti-spoofing al añadir interfaces."
    read: { type: sysctl, key: "net.ipv4.conf.default.rp_filter" }
    comparator: in
    expected: { good: ["1", "2"] }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.default.rp_filter = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-18
    category: KERNEL
    os: linux
    tier: deep
    description: "No enviar redirecciones ICMP por defecto en interfaces nuevas: un servidor que no hace de router no debe revelar rutas a la red."
    read: { type: sysctl, key: "net.ipv4.conf.default.send_redirects" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.default.send_redirects = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-19
    category: KERNEL
    os: linux
    tier: deep
    description: "No aceptar enrutado por origen por defecto en interfaces nuevas: cierra la vía de eludir cortafuegos también en las interfaces que se añadan más tarde."
    read: { type: sysctl, key: "net.ipv4.conf.default.accept_source_route" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.default.accept_source_route = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high

  - id: KRNL-20
    category: KERNEL
    os: linux
    tier: deep
    description: "Ignorar las respuestas de error ICMP mal formadas evita que un atacante provoque comportamientos anómalos en la pila de red con paquetes falsos."
    read: { type: sysctl, key: "net.ipv4.icmp_ignore_bogus_error_responses" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.icmp_ignore_bogus_error_responses = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-21
    category: KERNEL
    os: linux
    tier: deep
    description: "tcp_rfc1337 descarta los paquetes que llegan a una conexión en estado TIME-WAIT, frustrando un ataque que podría cerrar o corromper conexiones TCP legítimas."
    read: { type: sysctl, key: "net.ipv4.tcp_rfc1337" }
    comparator: eq
    expected: { good: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.tcp_rfc1337 = 1` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-22
    category: KERNEL
    os: linux
    tier: deep
    description: "La tecla mágica SysRq da acceso directo a funciones del kernel (matar procesos, reiniciar, volcar memoria). En un servidor no aporta y conviene desactivarla."
    read: { type: sysctl, key: "kernel.sysrq" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `kernel.sysrq = 0` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-23
    category: KERNEL
    os: linux
    tier: deep
    description: "protected_fifos evita un truco de escalada en directorios compartidos (como /tmp): impide escribir en FIFOs ajenas que un atacante haya dejado preparadas."
    read: { type: sysctl, key: "fs.protected_fifos" }
    comparator: eq
    expected: { good: "2", medium: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `fs.protected_fifos = 2` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-24
    category: KERNEL
    os: linux
    tier: deep
    description: "protected_regular es el equivalente para ficheros normales: bloquea el mismo tipo de ataque de sustitución de ficheros en directorios world-writable con sticky bit."
    read: { type: sysctl, key: "fs.protected_regular" }
    comparator: eq
    expected: { good: "2", medium: "1" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `fs.protected_regular = 2` en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-25
    category: KERNEL
    os: linux
    tier: deep
    description: "perf_event es una interfaz de rendimiento que también ha servido para exploits del kernel. Restringirla a root (paranoid >= 2) reduce el riesgo sin afectar a la operación normal."
    read: { type: sysctl, key: "kernel.perf_event_paranoid" }
    comparator: ge
    expected: { good: "2" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `kernel.perf_event_paranoid = 2` (o mayor) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: KRNL-26
    category: KERNEL
    os: linux
    tier: deep
    description: "Las redirecciones ICMP 'seguras' (de las puertas de enlace conocidas) siguen pudiendo desviar tu tráfico. En un servidor lo más seguro es no aceptar ninguna redirección."
    read: { type: sysctl, key: "net.ipv4.conf.all.secure_redirects" }
    comparator: eq
    expected: { good: "0" }
    points: 1
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Pon `net.ipv4.conf.all.secure_redirects = 0` (y `.default`) en sysctl y aplica con `sysctl --system`."
    ensControls: ["op.exp.2", "mp.com.1"]
    syntaxConfidence: high
