checks:
  - id: SSH-00
    category: SSH
    os: linux
    tier: core
    description: "Si SSH es tu vía de administración del servidor, el demonio sshd tiene que estar activo; si está caído, te quedas sin acceso remoto en el momento menos oportuno."
    read: { type: systemd, unit: "sshd" }
    comparator: eq
    expected: { good: "active" }
    points: 3
    severity: info
    criticality: BAJA
    applicability:
      anyOf:
        - { service: "sshd" }
        - { service: "ssh" }
    requiresPrivilege: false
    remediation: "Si necesitas SSH, actívalo y arráncalo con `systemctl enable --now ssh`. Si esta máquina no se administra por SSH, lo más limpio es desinstalar openssh-server para no dejar el puerto expuesto."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: SSH-01
    category: SSH
    os: linux
    tier: core
    description: "Entrar por SSH directamente como root mezcla la cuenta más poderosa del sistema con el acceso remoto y borra todo rastro de quién hizo qué. Obligar a entrar con un usuario nominal y luego escalar deja trazabilidad y reduce la superficie de ataque."
    read: { type: sshd_t, key: permitrootlogin }
    comparator: eq
    expected:
      good: "no"
      medium: ["prohibit-password", "without-password", "forced-commands-only"]
    points: 8
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `PermitRootLogin no` y recarga con `systemctl reload ssh`. IMPORTANTE: comprueba que tienes un usuario con sudo y acceso funcional antes de cerrar la sesión, o te puedes quedar fuera."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-02
    category: SSH
    os: linux
    tier: core
    description: "Con la autenticación por contraseña activa, cualquiera puede intentar adivinarla por fuerza bruta contra el puerto SSH. Exigir solo clave pública elimina de raíz ese vector."
    read: { type: sshd_t, key: passwordauthentication }
    comparator: eq
    expected: { good: "no" }
    points: 6
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `PasswordAuthentication no` y `KbdInteractiveAuthentication no`, y recarga con `systemctl reload ssh`. IMPORTANTE: instala antes tu clave pública o perderás el acceso."
    ensControls: ["op.acc.6", "mp.com.3"]
    syntaxConfidence: high

  - id: SSH-03
    category: SSH
    os: linux
    tier: deep
    description: "La clave pública es el método de autenticación recomendado en SSH: si está deshabilitada, no podrás prescindir de las contraseñas. Debe estar activa para poder cerrar el acceso por contraseña con seguridad."
    read: { type: sshd_t, key: pubkeyauthentication }
    comparator: eq
    expected: { good: "yes" }
    points: 3
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `PubkeyAuthentication yes` y recarga con `systemctl reload ssh`."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-04
    category: SSH
    os: linux
    tier: core
    description: "Permitir contraseñas vacías deja abierta la puerta a cualquier cuenta sin contraseña: equivale a un acceso sin autenticar. Es un riesgo crítico y nunca debe estar activado."
    read: { type: sshd_t, key: permitemptypasswords }
    comparator: eq
    expected: { good: "no" }
    points: 6
    severity: critical
    criticality: CRITICA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `PermitEmptyPasswords no` y recarga con `systemctl reload ssh`. Aprovecha para revisar que ninguna cuenta del sistema tenga contraseña vacía."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-05
    category: SSH
    os: linux
    tier: core
    description: "Cada conexión SSH permite varios intentos de autenticación antes de cortarse; cuantos más permitas, más fácil es probar contraseñas en bucle. Acotar MaxAuthTries frena los ataques de fuerza bruta."
    read: { type: sshd_t, key: maxauthtries }
    comparator: le
    expected: { good: "3", medium: "6" }
    points: 3
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `MaxAuthTries 3` y recarga con `systemctl reload ssh`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: SSH-07
    category: SSH
    os: linux
    tier: deep
    description: "El reenvío X11 tuneliza aplicaciones gráficas a través de SSH, pero amplía la superficie de ataque y casi nunca hace falta en un servidor. Conviene desactivarlo salvo que tengas una necesidad gráfica real."
    read: { type: sshd_t, key: x11forwarding }
    comparator: eq
    expected: { good: "no" }
    points: 2
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `X11Forwarding no` y recarga con `systemctl reload ssh`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: SSH-08
    category: SSH
    os: linux
    tier: deep
    description: "LoginGraceTime es el plazo que SSH da para completar la autenticación antes de cortar la conexión. Si es muy alto o ilimitado, las conexiones a medio autenticar se acumulan y abren la puerta a ataques de agotamiento de recursos."
    read: { type: sshd_t, key: logingracetime }
    comparator: le
    expected: { good: "60", medium: "120" }
    points: 2
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `LoginGraceTime 60` y recarga con `systemctl reload ssh`. Evita el valor 0, que significa sin límite de tiempo."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: SSH-11
    category: SSH
    os: linux
    tier: deep
    description: "Los cifrados que negocia SSH protegen la confidencialidad de la sesión; algoritmos antiguos como CBC, arcfour o 3DES tienen debilidades conocidas. Mantenerlos disponibles permite degradar la conexión a un cifrado vulnerable."
    read: { type: sshd_t, key: ciphers }
    comparator: nregex
    expected: { good: "(cbc|arcfour|3des|blowfish|cast128)" }
    points: 3
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config restringe `Ciphers` a algoritmos modernos (chacha20-poly1305, aes-gcm, aes-ctr) y recarga con `systemctl reload ssh`."
    ensControls: ["mp.com.2"]
    syntaxConfidence: high

  - id: SSH-12
    category: SSH
    os: linux
    tier: deep
    description: "Los MAC garantizan que nadie ha manipulado los datos de la sesión SSH; los basados en MD5 o SHA1 truncado ya no se consideran seguros. Dejarlos habilitados permite a un atacante forzar una negociación con integridad débil."
    read: { type: sshd_t, key: macs }
    comparator: nregex
    expected: { good: "(hmac-md5|hmac-sha1-96)" }
    points: 2
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config restringe `MACs` a algoritmos -etm modernos (hmac-sha2-256/512-etm, umac-128-etm) y recarga con `systemctl reload ssh`."
    ensControls: ["mp.com.2"]
    syntaxConfidence: high

  - id: SSH-13
    category: SSH
    os: linux
    tier: deep
    description: "El intercambio de claves (KEX) es donde cliente y servidor acuerdan el secreto de la sesión; SHA1 y los grupos Diffie-Hellman pequeños son atacables hoy. Si siguen disponibles, la conexión puede negociarse con un intercambio débil."
    read: { type: sshd_t, key: kexalgorithms }
    comparator: nregex
    expected: { good: "(group1-sha1|group-exchange-sha1|diffie-hellman-group14-sha1|gss-)" }
    points: 2
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config restringe `KexAlgorithms` a curve25519-sha256 y diffie-hellman-group16/18-sha512, y recarga con `systemctl reload ssh`."
    ensControls: ["mp.com.2"]
    syntaxConfidence: review

  - id: SSH-17
    category: SSH
    os: linux
    tier: deep
    description: "Sin un registro suficientemente detallado, sshd no deja huella de quién entra ni con qué clave, y una investigación forense se queda a ciegas. Un nivel informativo o verboso conserva la traza de accesos."
    read: { type: sshd_t, key: loglevel }
    comparator: in
    expected: { good: ["INFO", "VERBOSE"] }
    points: 2
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `LogLevel VERBOSE` y recarga con `systemctl reload ssh`. VERBOSE registra además la huella de la clave usada en cada acceso, muy útil para auditoría."
    ensControls: ["op.exp.8"]
    syntaxConfidence: review

  - id: SSH-19
    category: SSH
    os: linux
    tier: deep
    description: "PAM es lo que permite a SSH aplicar las políticas del sistema: bloqueo de cuentas tras intentos fallidos, límites de recursos y segundo factor. Sin UsePAM activo, todas esas defensas se quedan fuera del flujo de login por SSH."
    read: { type: sshd_t, key: usepam }
    comparator: eq
    expected: { good: "yes" }
    points: 2
    severity: low
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `UsePAM yes` y recarga con `systemctl reload ssh`."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-06
    category: SSH
    os: linux
    tier: deep
    description: "La autenticación basada en host confía en la máquina de origen en lugar de en el usuario, una herencia de los antiguos servicios r* que es fácil de suplantar. No aporta nada hoy y debe estar desactivada."
    read: { type: sshd_t, key: hostbasedauthentication }
    comparator: eq
    expected: { good: "no" }
    points: 2
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `HostbasedAuthentication no` y recarga con `systemctl reload ssh`."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-09
    category: SSH
    os: linux
    tier: deep
    description: "Los ficheros .rhosts permiten que un usuario declare por su cuenta en qué máquinas confía para entrar sin contraseña. Ignorarlos evita esas confianzas implícitas que un atacante podría aprovechar para moverse de un equipo a otro."
    read: { type: sshd_t, key: ignorerhosts }
    comparator: eq
    expected: { good: "yes" }
    points: 2
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `IgnoreRhosts yes` y recarga con `systemctl reload ssh`."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-10
    category: SSH
    os: linux
    tier: deep
    description: "El reenvío de puertos TCP permite tunelizar tráfico a través de SSH; si no lo necesitas, un usuario o un atacante con acceso puede usar el servidor como trampolín hacia la red interna. Desactivarlo cierra ese pivote."
    read: { type: sshd_t, key: allowtcpforwarding }
    comparator: eq
    expected: { good: "no" }
    points: 1
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "Si no necesitas túneles, en /etc/ssh/sshd_config pon `AllowTcpForwarding no` y recarga con `systemctl reload ssh`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high

  - id: SSH-15
    category: SSH
    os: linux
    tier: deep
    description: "Una sesión SSH que queda abierta y sin uso es una puerta que cualquiera con acceso a la terminal puede aprovechar. Acotar ClientAliveCountMax junto con el intervalo de sondeo hace que el servidor cierre las conexiones inactivas u huérfanas."
    read: { type: sshd_t, key: clientalivecountmax }
    comparator: le
    expected: { good: "3" }
    points: 1
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `ClientAliveInterval 300` y `ClientAliveCountMax 3`, y recarga con `systemctl reload ssh`. Así una sesión inactiva se cierra a los 15 minutos (300 segundos x 3)."
    ensControls: ["op.acc.6", "op.exp.2"]
    syntaxConfidence: high

  - id: SSH-16
    category: SSH
    os: linux
    tier: deep
    description: "Una sola conexión SSH puede multiplexar varias sesiones a la vez; sin un tope, esto se presta a abuso y a consumir recursos del servidor. MaxSessions limita cuántas sesiones admite cada conexión."
    read: { type: sshd_t, key: maxsessions }
    comparator: le
    expected: { good: "10" }
    points: 1
    severity: low
    criticality: BAJA
    applicability:
      anyOf:
        - { service: sshd }
        - { service: ssh }
        - { file: "/etc/ssh/sshd_config" }
    requiresPrivilege: true
    remediation: "En /etc/ssh/sshd_config pon `MaxSessions 10` (o menos según tu uso) y recarga con `systemctl reload ssh`."
    ensControls: ["op.exp.2"]
    syntaxConfidence: high
