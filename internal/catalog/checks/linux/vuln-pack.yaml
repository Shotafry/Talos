checks:
  # Pack "joyas por VERSION de paquete corregida" (tier deep = musculo del modo standalone
  # OFFLINE: en nativo NO aporta sobre Trivy/OSV, que ya cubren CVEs por versión). Detecta una
  # instalacion SIN actualizar comparando la versión instalada con la PRIMERA versión corregida
  # POR DISTRO+RELEASE (no upstream): los distros parchean por backport sin subir la versión
  # upstream, así que un fixed-versión upstream daría FALSOS POSITIVOS masivos (leccion CLAUDE
  # 9.14). Solo se curan CVEs donde la release SALIO vulnerable y se corrigio con +debXuY/ubuntuN
  # (las CVEs antiguas que ya salieron corregidas de fabrica las cubre Trivy/OSV, no este pack).
  # Versiones-fix verificadas contra Debian Security Tracker + Ubuntu CVE Tracker (2026-06-25).
  # comparator vge: PASS si instalada >= corregida (parcheada); FAIL si instalada < corregida
  # (vulnerable). pkgver ausente -> NA (la vuln no aplica). applicability acota a distro+release.

  # --- Debian 11 (bullseye) ---
  - id: VULNPKG-PWNKIT-DEB11
    category: VULN
    os: linux
    tier: deep
    description: "PwnKit (CVE-2021-4034): escalada local a root por pkexec/polkit sin actualizar en Debian 11."
    read: { type: pkgver, key: "policykit-1" }
    comparator: vge
    expected: { good: "0.105-31+deb11u1" }
    points: 5
    severity: critical
    criticality: CRITICA
    applicability:
      allOf:
        - { os: debian }
        - { release: "11" }
    requiresPrivilege: false
    remediation: "Actualiza polkit: apt-get update && apt-get install --only-upgrade policykit-1 (corregido en 0.105-31+deb11u1)."
    ensControls: ["op.exp.3"]
    syntaxConfidence: review

  - id: VULNPKG-SUDOEDIT-DEB11
    category: VULN
    os: linux
    tier: deep
    description: "sudoedit (CVE-2023-22809): edicion de ficheros arbitrarios vía sudo sin actualizar en Debian 11."
    read: { type: pkgver, key: "sudo" }
    comparator: vge
    expected: { good: "1.9.5p2-3+deb11u1" }
    points: 4
    severity: high
    criticality: ALTA
    applicability:
      allOf:
        - { os: debian }
        - { release: "11" }
    requiresPrivilege: false
    remediation: "Actualiza sudo: apt-get install --only-upgrade sudo (corregido en 1.9.5p2-3+deb11u1)."
    ensControls: ["op.exp.3"]
    syntaxConfidence: review

