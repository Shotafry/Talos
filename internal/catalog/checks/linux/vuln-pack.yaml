  # php2shell (CVE-2026-109618 y CVE-2026-109619, 21-10-2026): ejecucion de codigo sin autenticar
  # por memoria mal gestionada entre peticiones de PHP. Version corregida POR DISTRO+RELEASE, del
  # Debian Security Tracker (DSA-6574-1, DLA-4848-1) y del Ubuntu CVE Tracker, leidos el 2026-10-26.
  # Se mira `phpX.Y-common`, que llega con cualquier forma de instalar PHP (FPM, CLI o el modulo de
  # Apache). Debian 11 no aparece en el tracker para esta CVE y no lleva ficha.
  - id: VULNPKG-PHP2SHELL-DEB12
    category: VULN
    os: linux
    tier: deep
    description: "php2shell (CVE-2026-109618 y CVE-2026-109619): ejecución remota de código sin autenticar en PHP sin actualizar en Debian 12."
    read: { type: pkgver, key: "php8.2-common" }
    comparator: vge
    expected: { good: "8.2.35-1~deb12u1" }
    points: 5
    severity: critical
    criticality: CRITICA
    applicability:
      allOf:
        - { os: debian }
        - { release: "12" }
    requiresPrivilege: false
    remediation: "Actualiza PHP: apt-get update && apt-get install --only-upgrade 'php8.2*' (corregido en 8.2.35-1~deb12u1) y reinicia PHP-FPM o Apache."
    ensControls: ["op.exp.3"]
