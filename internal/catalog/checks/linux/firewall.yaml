checks:
  - id: FW-01
    category: FIREWALL
    os: linux
    tier: core
    description: "UFW es el cortafuegos del propio host y debería estar activo para filtrar el tráfico de red entrante. Sin él, cualquier servicio a la escucha queda directamente expuesto a quien alcance la máquina."
    read: { type: exec, cmd: ["ufw", "status"] }
    comparator: regex
    expected: { good: "Status: active" }
    points: 6
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { package: ufw }
    requiresPrivilege: true
    remediation: "Permite primero el puerto SSH (`ufw allow OpenSSH`) para no perder el acceso remoto y luego activa el cortafuegos con `ufw enable`."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: FW-02
    category: FIREWALL
    os: linux
    tier: core
    description: "firewalld es el servicio de cortafuegos por zonas habitual en distribuciones tipo RHEL y debe estar en ejecución para filtrar el tráfico. Si está parado, las reglas no se aplican y los servicios quedan al descubierto."
    read: { type: exec, cmd: ["firewall-cmd", "--state"] }
    comparator: eq
    expected: { good: "running" }
    points: 6
    severity: high
    criticality: ALTA
    applicability:
      anyOf:
        - { package: firewalld }
    requiresPrivilege: false
    remediation: "Arranca firewalld y déjalo permanente con `systemctl enable --now firewalld`, y revisa que la zona activa solo permita los servicios necesarios."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: FW-03
    category: FIREWALL
    os: linux
    tier: deep
    description: "nftables es el motor de filtrado del kernel, pero solo protege si tiene reglas cargadas. Un conjunto de reglas vacío equivale a no tener cortafuegos: todo el tráfico pasa sin restricción."
    read: { type: exec, cmd: ["nft", "list", "ruleset"] }
    comparator: regex
    expected: { good: "(chain|table)" }
    points: 3
    severity: medium
    criticality: MEDIA
    applicability:
      anyOf:
        - { package: nftables }
    requiresPrivilege: true
    remediation: "Define un conjunto de reglas en /etc/nftables.conf con una política por defecto restrictiva y aplícalo (`nft -f /etc/nftables.conf`); no dejes el ruleset vacío."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: review
