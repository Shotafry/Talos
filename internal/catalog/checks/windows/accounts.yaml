checks:
  - id: WIN-ACC-01
    category: USERS
    os: windows
    tier: core
    description: "Si las cuentas locales admiten contraseñas cortas, se rompen por fuerza bruta en poco tiempo. Exigir 14 caracteres o más eleva mucho el coste de adivinarlas."
    read: { type: netaccounts, key: minPwLen }
    comparator: ge
    expected: { good: "14", medium: "8" }
    points: 6
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Sube la longitud mínima a 14 con `net accounts /minpwlen:14`, o por directiva de seguridad local (`secpol.msc` > Directivas de cuenta > Directiva de contraseñas) o por GPO."
    ensControls: ["op.acc.5", "op.acc.6"]
    syntaxConfidence: high

  - id: WIN-ACC-02
    category: USERS
    os: windows
    tier: deep
    description: "Una contraseña que nunca caduca puede seguir siendo válida años después de filtrarse. Acotar su vida útil obliga a renovarla y limita la ventana de un robo no detectado."
    read: { type: netaccounts, key: maxPwAge }
    comparator: le
    expected: { good: "365" }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Define una caducidad máxima razonable, por ejemplo `net accounts /maxpwage:365`, o por GPO/directiva de seguridad local. Evita el valor 'nunca caduca'."
    ensControls: ["op.acc.5"]
    syntaxConfidence: high

  - id: WIN-ACC-03
    category: USERS
    os: windows
    tier: core
    description: "Sin bloqueo de cuenta, un atacante puede probar contraseñas sin límite hasta dar con la buena. Bloquear tras unos pocos intentos fallidos (entre 1 y 5) corta los ataques de fuerza bruta en seco."
    read: { type: netaccounts, key: lockoutThreshold }
    comparator: range
    # 1-5 intentos = bueno (corta la fuerza bruta antes de que sea rentable, y un usuario
    # que se equivoca al teclear rara vez pasa de ahi); 6-10 = aceptable pero flojo (WARN);
    # 0 = sin bloqueo o >10 = FAIL.
    expected: { good: "[1,5]", medium: "[6,10]" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Fija el umbral de bloqueo entre 1 y 5 intentos con `net accounts /lockoutthreshold:5`, o por GPO/directiva de seguridad local. Ten en cuenta que el valor 0 desactiva por completo el bloqueo."
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: high
