checks:
  - id: WIN-SMB-01
    category: SMB
    os: windows
    tier: core
    description: "SMBv1 es la versión original del protocolo de compartición de archivos, plagada de fallos y explotada masivamente por WannaCry y EternalBlue para propagarse por la red. Está obsoleta y debe estar desactivada en cualquier equipo."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'SMB1' }
    comparator: in
    expected: { good: ["absent", "0"] }
    points: 10
    severity: critical
    criticality: CRITICA
    requiresPrivilege: false
    remediation: "Desactiva SMBv1 desinstalando la característica con Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol y reinicia. La ausencia de la clave SMB1 equivale a SMBv1 desactivado, así que no hace falta crearla."
    ensControls: ["mp.com.1", "op.exp.3"]
    syntaxConfidence: high

  - id: WIN-SMB-02
    category: SMB
    os: windows
    tier: core
    description: "La firma de paquetes SMB garantiza la integridad y autenticidad de cada mensaje, de modo que un atacante no pueda interceptar y reutilizar una sesión (ataques de retransmisión o relay). El servidor SMB debe exigirla siempre."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'RequireSecuritySignature' }
    comparator: eq
    expected: { good: "1" }
    points: 6
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: 'Exige la firma SMB del servidor poniendo RequireSecuritySignature=1 en HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters, o por GPO con "Servidor de red Microsoft: firmar digitalmente las comunicaciones (siempre)".'
    ensControls: ["mp.com.2", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-SMB-03
    category: SMB
    os: windows
    tier: core
    description: "Igual que en el servidor, el cliente SMB debe exigir la firma de paquetes para que cada conexión saliente verifique la integridad y autenticidad del tráfico y no pueda ser manipulada por un intermediario en la red."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters', name: 'RequireSecuritySignature' }
    comparator: eq
    expected: { good: "1" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Exige la firma SMB del cliente poniendo RequireSecuritySignature=1 en HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters, o por GPO con "Cliente de redes Microsoft: firmar digitalmente las comunicaciones (siempre)".'
    ensControls: ["mp.com.2", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-SMB-04
    category: SMB
    os: windows
    tier: core
    description: "El acceso de invitado inseguro permite conectar a recursos compartidos SMB sin autenticarse ni firmar, lo que abre la puerta a ataques de intermediario y a la exposición de datos. Estos inicios de sesión de invitado deben estar prohibidos."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters', name: 'AllowInsecureGuestAuth' }
    comparator: in
    expected: { good: ["absent", "0"] }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Prohíbe el acceso de invitado inseguro poniendo AllowInsecureGuestAuth=0 en HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters, o por GPO con "Habilitar inicios de sesión de invitado no seguros" deshabilitado. Si la clave no existe, ya es seguro por defecto.'
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: high
