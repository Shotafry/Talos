checks:
  - id: WIN-CRED-01
    category: CREDS
    os: windows
    tier: core
    description: "El proceso LSASS guarda en memoria credenciales y hashes que herramientas como Mimikatz roban para moverse por la red. Ejecutarlo como proceso protegido (RunAsPPL) impide que otros procesos lean su memoria y frena ese volcado."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: 'RunAsPPL' }
    comparator: in
    expected: { good: ["1", "2"] }
    points: 8
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: 'Activa LSASS protegido poniendo RunAsPPL=1 (o 2 para fijarlo con bloqueo UEFI) en HKLM\SYSTEM\CurrentControlSet\Control\Lsa y reinicia el equipo. Conviene probarlo antes por si algún driver o software de seguridad no es compatible.'
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-CRED-02
    category: CREDS
    os: windows
    tier: core
    description: "El proveedor WDigest, si está activo, deja la contraseña del usuario en texto claro dentro de la memoria de LSASS, un regalo para quien logre volcarla. Con UseLogonCredential a 0 o sin la clave, esa caché desaparece."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest', name: 'UseLogonCredential' }
    comparator: in
    expected: { good: ["absent", "0"] }
    points: 6
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: 'Asegura UseLogonCredential=0 en HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest, o simplemente que la clave no exista. En sistemas modernos ya es el valor por defecto.'
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-CRED-03
    category: CREDS
    os: windows
    tier: core
    description: "Una sesión nula deja que alguien sin autenticar liste cuentas, grupos y recursos compartidos, el primer paso para preparar un ataque. Restringir el acceso anónimo cierra esa vía de reconocimiento."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: 'RestrictAnonymous' }
    comparator: eq
    expected: { good: "1" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Pon RestrictAnonymous=1 en HKLM\SYSTEM\CurrentControlSet\Control\Lsa, o gestiónalo por GPO con la directiva de seguridad que restringe el acceso anónimo a cuentas y recursos.'
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-CRED-04
    category: CREDS
    os: windows
    tier: deep
    description: "Credential Guard usa la virtualización para encerrar los secretos de LSA en un contenedor aislado al que ni el sistema operativo puede acceder. Con el activo, aunque comprometan el equipo, robar credenciales de memoria se vuelve mucho más difícil."
    read: { type: cmdlet, cmd: ["[int]((Get-CimInstance -Namespace root\\Microsoft\\Windows\\DeviceGuard -ClassName Win32_DeviceGuard).SecurityServicesRunning -contains 1)"] }
    comparator: eq
    expected: { good: "1" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Habilita Credential Guard por GPO con "Activar la seguridad basada en virtualización" (Plantillas administrativas > Sistema > Device Guard), eligiendo la opción de Credential Guard. Necesita VBS/UEFI y hardware compatible, así que verifica los requisitos antes de desplegarlo.'
    ensControls: ["op.acc.5", "op.exp.2"]
    syntaxConfidence: review

  - id: WIN-CRED-05
    category: CREDS
    os: windows
    tier: deep
    description: "La seguridad basada en virtualización (VBS) crea un entorno aislado por hardware que sirve de cimiento a defensas como Credential Guard y HVCI. Sin VBS en marcha, esas protecciones no pueden funcionar."
    read: { type: cmdlet, cmd: ["(Get-CimInstance -Namespace root\\Microsoft\\Windows\\DeviceGuard -ClassName Win32_DeviceGuard).VirtualizationBasedSecurityStatus"] }
    comparator: eq
    expected: { good: "2" }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: 'Activa VBS por GPO ("Activar la seguridad basada en virtualización") o por registro en HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard, sobre hardware con virtualización y arranque seguro habilitados en la BIOS/UEFI.'
    ensControls: ["op.exp.2"]
    syntaxConfidence: review
