checks:
  - id: WIN-NET-01
    category: NAMERES
    os: windows
    tier: core
    description: "LLMNR resuelve nombres por multidifusión cuando falla el DNS, y un atacante en la misma red puede responder en lugar del servidor legítimo para capturar hashes de credenciales (envenenamiento LLMNR). Debe estar desactivado."
    read: { type: registry, path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient', name: 'EnableMulticast' }
    comparator: eq
    expected: { good: "0" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Desactiva LLMNR por GPO (Plantillas administrativas > Red > Cliente DNS > Desactivar la resolución de nombres multidifusión) o pon EnableMulticast=0 en HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient. Si la clave no existe, LLMNR sigue activo.'
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-TLS-01
    category: TLS
    os: windows
    tier: deep
    description: "TLS 1.2 es el protocolo de cifrado mínimo aceptable para las comunicaciones del servidor, así que SChannel debe ofrecerlo y no tenerlo deshabilitado explícitamente. Si está deshabilitado, los clientes caen a protocolos antiguos o no pueden conectar de forma segura."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server', name: 'Enabled' }
    comparator: in
    # SChannel marca "habilitado" como 1 o, idiomaticamente, 0xffffffff (=4294967295). Ausente
    # = habilitado por defecto. Solo Enabled=0 (deshabilitado explicito) debe fallar.
    expected: { good: ["absent", "1", "4294967295"] }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: 'Mantén TLS 1.2 habilitado en SCHANNEL\Protocols\TLS 1.2\Server: con Enabled=1 o con la clave ausente queda habilitado por defecto. Lo que debes deshabilitar son los protocolos viejos (SSL 3.0, TLS 1.0 y TLS 1.1).'
    ensControls: ["mp.com.2"]
    syntaxConfidence: high

  - id: WIN-TLS-02
    category: TLS
    os: windows
    tier: deep
    description: "TLS 1.0 es un protocolo obsoleto con debilidades criptográficas conocidas (BEAST, downgrade) que ya no cumple los estándares actuales. SChannel debe tenerlo deshabilitado como protocolo de servidor para que ningún cliente pueda negociarlo."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server', name: 'Enabled' }
    comparator: in
    expected: { good: ["0"], medium: ["absent"] }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Deshabilita TLS 1.0 en SCHANNEL\Protocols\TLS 1.0\Server poniendo Enabled=0 y DisabledByDefault=1, y reinicia. Ten en cuenta que si la clave no existe el protocolo puede seguir activo en sistemas antiguos, así que crea la clave explícitamente.'
    ensControls: ["mp.com.2"]
    syntaxConfidence: high

  - id: WIN-TLS-03
    category: TLS
    os: windows
    tier: deep
    description: "TLS 1.1 es un protocolo obsoleto, retirado por los navegadores y los estándares de la industria por su criptografía débil. SChannel debe tenerlo deshabilitado como protocolo de servidor para forzar el uso de TLS 1.2 o superior."
    read: { type: registry, path: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server', name: 'Enabled' }
    comparator: in
    expected: { good: ["0"], medium: ["absent"] }
    points: 2
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Deshabilita TLS 1.1 en SCHANNEL\Protocols\TLS 1.1\Server poniendo Enabled=0 y DisabledByDefault=1, y reinicia. Crea la clave de forma explícita aunque no exista, para no dejarlo a la negociación por defecto.'
    ensControls: ["mp.com.2"]
    syntaxConfidence: high
