checks:
  - id: WIN-FW-01
    category: FIREWALL
    os: windows
    tier: core
    description: "El perfil de Dominio se aplica cuando el equipo está en la red corporativa. Tener el cortafuegos activo ahi evita que una máquina ya comprometida ataque libremente a las demas del dominio."
    read: { type: cmdlet, cmd: ["(Get-NetFirewallProfile -Name Domain).Enabled"] }
    comparator: eq
    expected: { good: "true" }
    points: 8
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Activa el cortafuegos del perfil de Dominio con `Set-NetFirewallProfile -Name Domain -Enabled True`, o por GPO si los equipos se gestionan de forma centralizada."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-FW-02
    category: FIREWALL
    os: windows
    tier: core
    description: "El perfil Privado cubre redes de confianza como la de casa o una oficina pequeña. Aun en esas redes el cortafuegos debe seguir activo, porque cualquier equipo vecino infectado podría intentar alcanzar al tuyo."
    read: { type: cmdlet, cmd: ["(Get-NetFirewallProfile -Name Private).Enabled"] }
    comparator: eq
    expected: { good: "true" }
    points: 8
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Activa el cortafuegos del perfil Privado con `Set-NetFirewallProfile -Name Private -Enabled True`, o por GPO si los equipos se gestionan de forma centralizada."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-FW-03
    category: FIREWALL
    os: windows
    tier: core
    description: "El perfil Público se activa en redes no confiables, como el wifi de un aeropuerto o una cafetería, donde cualquiera puede estar a la escucha. Es justo donde el cortafuegos resulta más crítico para no exponer servicios del equipo."
    read: { type: cmdlet, cmd: ["(Get-NetFirewallProfile -Name Public).Enabled"] }
    comparator: eq
    expected: { good: "true" }
    points: 10
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Activa el cortafuegos del perfil Público con `Set-NetFirewallProfile -Name Public -Enabled True`, o por GPO si los equipos se gestionan de forma centralizada."
    ensControls: ["mp.com.1", "op.exp.2"]
    syntaxConfidence: high
