checks:
  - id: WIN-AUD-01
    category: AUDIT
    os: windows
    tier: core
    description: "Buena parte de los ataques modernos se apoyan en PowerShell. Registrar los bloques de script deja en el visor de eventos el código que se ejecutó, que es la huella con la que se investiga después un script malicioso."
    read: { type: registry, path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', name: 'EnableScriptBlockLogging' }
    comparator: eq
    expected: { good: "1" }
    points: 4
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: 'Activa el registro de bloques de script por GPO (Plantillas administrativas > Componentes de Windows > Windows PowerShell > Activar el registro de bloques de script) o pon EnableScriptBlockLogging=1 en HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging.'
    ensControls: ["op.exp.8"]
    syntaxConfidence: high

  - id: WIN-AUD-02
    category: AUDIT
    os: windows
    tier: deep
    description: "Un evento que dice que arrancó `powershell.exe` no distingue una tarea programada de un ataque: eso lo dicen los argumentos con los que se lanzó. Con la línea de comandos completa en los eventos 4688 se cazan ejecuciones sospechosas y se reconstruye lo que hizo un atacante."
    read: { type: registry, path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit', name: 'ProcessCreationIncludeCmdLine_Enabled' }
    comparator: eq
    expected: { good: "1" }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: 'Activa por GPO la directiva "Incluir línea de comandos en eventos de creación de procesos" o pon ProcessCreationIncludeCmdLine_Enabled=1 en HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit. Recuerda que también debe estar auditada la creación de procesos: sin eso no se genera el evento 4688 y no hay dónde escribir la línea de comandos.'
    ensControls: ["op.exp.8"]
    syntaxConfidence: high

  # (2026.08.1) EL TAMAÑO DEL REGISTRO DE SEGURIDAD. Es el complemento de WIN-AUD-01 y WIN-AUD-02 y
  # el que decide si sirven de algo: con el valor de fabrica (20 MB) un servidor con auditoria de
  # procesos activada rota su registro en horas, asi que la evidencia de un incidente de anteayer ya
  # no existe cuando alguien va a buscarla. Registrar mas y guardar menos es peor que no registrar,
  # porque da por cubierto lo que no lo esta.
  - id: WIN-AUD-03
    category: AUDIT
    os: windows
    tier: core
    description: "El registro de seguridad tiene un tamaño máximo y, al llenarse, sobrescribe lo más antiguo. Con el valor de fábrica y la auditoría de procesos activada, un servidor puede rotar su registro en horas: cuando alguien va a investigar un incidente de anteayer, ya no queda nada."
    read: { type: cmdlet, cmd: ["[int]((Get-WinEvent -ListLog Security).MaximumSizeInBytes / 1MB)"] }
    comparator: ge
    expected: { good: "196" }
    points: 3
    severity: medium
    criticality: MEDIA
    requiresPrivilege: true
    remediation: 'Sube el tamaño máximo del registro de seguridad a 200 MB o más con `Limit-EventLog -LogName Security -MaximumSize 200MB`. Por GPO vive en Configuración del equipo > Directivas > Plantillas administrativas > Componentes de Windows > Servicio de registro de eventos > Seguridad. Si envías los eventos a un colector central, ajusta el tamaño a lo que tarde en recogerlos.'
    ensControls: ["op.exp.8", "op.mon.1"]
    syntaxConfidence: review
