checks:
  - id: WIN-DEF-01
    category: DEFENDER
    os: windows
    tier: core
    description: "La protección en tiempo real de Microsoft Defender debe estar activa."
    read: { type: cmdlet, cmd: ["(Get-MpComputerStatus).RealTimeProtectionEnabled"] }
    comparator: eq
    expected: { good: "true" }
    points: 10
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Activa la protección en tiempo real de Defender (o verifica que otro antivirus la cubre). Set-MpPreference -DisableRealtimeMonitoring $false."
    ensControls: ["op.exp.6", "op.exp.3"]
    syntaxConfidence: high

  - id: WIN-DEF-02
    category: DEFENDER
    os: windows
    tier: core
    description: "La protección contra manipulaciones (Tamper Protection) debe estar activa para que el malware no apague Defender."
    read: { type: cmdlet, cmd: ["(Get-MpComputerStatus).IsTamperProtected"] }
    comparator: eq
    expected: { good: "true" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Activa la protección contra manipulaciones desde Seguridad de Windows > Proteccion antivirus."
    ensControls: ["op.exp.6", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-DEF-03
    category: DEFENDER
    os: windows
    tier: core
    description: "La protección de red (Network Protection) debería bloquear conexiones a dominios maliciosos."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).EnableNetworkProtection"] }
    comparator: eq
    expected: { good: "1", medium: "2" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Activa la protección de red en modo bloqueo: Set-MpPreference -EnableNetworkProtection Enabled (1=bloqueo, 2=auditoria)."
    ensControls: ["op.exp.6", "mp.com.1"]
    syntaxConfidence: high

  - id: WIN-DEF-04
    category: DEFENDER
    os: windows
    tier: deep
    description: "El acceso controlado a carpetas (anti-ransomware) debería estar activo."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).EnableControlledFolderAccess"] }
    comparator: eq
    expected: { good: "1", medium: "2" }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Activa el acceso controlado a carpetas: Set-MpPreference -EnableControlledFolderAccess Enabled."
    ensControls: ["op.exp.6"]
    syntaxConfidence: high

  - id: WIN-DEF-05
    category: DEFENDER
    os: windows
    tier: deep
    description: "El envio de muestras a la nube (MAPS/cloud) debería estar configurado para mejorar la detección."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).MAPSReporting"] }
    comparator: eq
    expected: { good: "2", medium: "1" }
    points: 2
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Configura MAPS avanzado: Set-MpPreference -MAPSReporting Advanced (2)."
    ensControls: ["op.exp.6"]
    syntaxConfidence: high

  - id: WIN-DEF-06
    category: DEFENDER
    os: windows
    tier: core
    description: "Deberia haber reglas de reducción de superficie de ataque (ASR) configuradas."
    read: { type: cmdlet, cmd: ["@((Get-MpPreference).AttackSurfaceReductionRules_Ids | Where-Object {$_}).Count"] }
    comparator: ge
    expected: { good: "1" }
    points: 4
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Configura reglas ASR (bloqueo de macros de Office, robo de credenciales LSASS, etc.) con Set-MpPreference -AttackSurfaceReductionRules_Ids/-Actions."
    ensControls: ["op.exp.6", "op.exp.2"]
    syntaxConfidence: high
