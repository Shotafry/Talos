checks:
  - id: WIN-DEF-01
    category: DEFENDER
    os: windows
    tier: core
    description: "La protección en tiempo real es la primera línea de defensa: analiza archivos y procesos en el momento en que se abren o ejecutan. Si está apagada, el malware puede instalarse sin que nada lo intercepte."
    read: { type: cmdlet, cmd: ["(Get-MpComputerStatus).RealTimeProtectionEnabled"] }
    comparator: eq
    expected: { good: "true" }
    points: 10
    severity: high
    criticality: ALTA
    requiresPrivilege: false
    remediation: "Reactiva la protección en tiempo real con `Set-MpPreference -DisableRealtimeMonitoring $false`, o confirma que otro antivirus de confianza está asumiendo esa función (en ese caso Defender se desactiva solo)."
    ensControls: ["op.exp.6", "op.exp.3"]
    syntaxConfidence: high

  - id: WIN-DEF-02
    category: DEFENDER
    os: windows
    tier: core
    description: "Muchos ataques empiezan por desactivar el antivirus. La protección contra manipulaciones (Tamper Protection) blinda los ajustes de Defender para que ni el malware ni cambios no autorizados puedan apagarlo."
    read: { type: cmdlet, cmd: ["(Get-MpComputerStatus).IsTamperProtected"] }
    comparator: eq
    expected: { good: "true" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Activa la protección contra manipulaciones desde Seguridad de Windows > Protección antivirus y contra amenazas > Administrar la configuración. En equipos gestionados conviene fijarla por Intune o GPO para que no se pueda desactivar localmente."
    ensControls: ["op.exp.6", "op.exp.2"]
    syntaxConfidence: high

  - id: WIN-DEF-03
    category: DEFENDER
    os: windows
    tier: core
    description: "La protección de red impide que el equipo conecte con dominios e IP de reputación peligrosa, cortando descargas de malware y comunicaciones con servidores de control. Es una barrera útil incluso cuando el navegador no la ofrece."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).EnableNetworkProtection"] }
    comparator: eq
    expected: { good: "1", medium: "2" }
    points: 5
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Activa la protección de red en modo bloqueo con `Set-MpPreference -EnableNetworkProtection Enabled` (1 = bloqueo). El modo auditoría (2) solo registra sin bloquear, útil para probar antes de aplicarlo en serio."
    ensControls: ["op.exp.6", "mp.com.1"]
    syntaxConfidence: high

  - id: WIN-DEF-04
    category: DEFENDER
    os: windows
    tier: deep
    description: "El acceso controlado a carpetas protege las carpetas de documentos frente al ransomware: solo las aplicaciones de confianza pueden modificar su contenido, así que un cifrador no autorizado se queda fuera."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).EnableControlledFolderAccess"] }
    comparator: eq
    expected: { good: "1", medium: "2" }
    points: 3
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Activa el acceso controlado a carpetas con `Set-MpPreference -EnableControlledFolderAccess Enabled`. Como puede bloquear aplicaciones legítimas, conviene empezar en modo auditoría y añadir las apps de confianza antes de pasar a bloqueo."
    ensControls: ["op.exp.6"]
    syntaxConfidence: high

  - id: WIN-DEF-05
    category: DEFENDER
    os: windows
    tier: deep
    description: "Con el envío de muestras a la nube activo, Defender consulta la inteligencia de Microsoft y comparte archivos sospechosos, lo que le permite detectar amenazas nuevas mucho antes de que existan firmas locales."
    read: { type: cmdlet, cmd: ["(Get-MpPreference).MAPSReporting"] }
    comparator: eq
    expected: { good: "2", medium: "1" }
    points: 2
    severity: low
    criticality: BAJA
    requiresPrivilege: false
    remediation: "Configura el envío avanzado con `Set-MpPreference -MAPSReporting Advanced` (valor 2). El nivel básico (1) es aceptable, pero el avanzado aprovecha mejor la protección en la nube."
    ensControls: ["op.exp.6"]
    syntaxConfidence: high

  - id: WIN-DEF-06
    category: DEFENDER
    os: windows
    tier: core
    description: "Las reglas de reducción de superficie de ataque (ASR) bloquean técnicas que el malware usa una y otra vez, como las macros de Office que descargan código o el robo de credenciales desde LSASS. Sin ninguna regla activa, esas vias quedan abiertas."
    read: { type: cmdlet, cmd: ["@((Get-MpPreference).AttackSurfaceReductionRules_Ids | Where-Object {$_}).Count"] }
    comparator: ge
    expected: { good: "1" }
    points: 4
    severity: medium
    criticality: MEDIA
    requiresPrivilege: false
    remediation: "Define reglas ASR (bloqueo de macros de Office que ejecutan código, robo de credenciales desde LSASS, etc.) con `Set-MpPreference -AttackSurfaceReductionRules_Ids` y `-AttackSurfaceReductionRules_Actions`. Empieza en modo auditoría para no romper aplicaciones legítimas y pasa a bloqueo cuando lo valides."
    ensControls: ["op.exp.6", "op.exp.2"]
    syntaxConfidence: high
