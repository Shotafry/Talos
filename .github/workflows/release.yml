# CI de Talos (repo extraido). Al empujar un tag vX.Y.Z: prueba, compila para
# Linux/Windows (amd64/arm64), publica binarios + SHA256SUMS + catalog.tar.gz en la release.
# En el monorepo de origen este workflow no se dispara (vive bajo tools/talos/.github/).
#
# Las acciones van pinchadas por SHA con su version en el comentario, como en el monorepo: un tag
# de accion se puede mover al commit que quiera su autor, un SHA no. Para subir una, el SHA sale
# de `gh api repos/<owner>/<accion>/git/ref/tags/<tag> -q .object.sha` (si el ref es un tag
# anotado, hay que dereferenciarlo con `git/tags/<sha>`).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.24" }
      - name: Compilar binarios
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"   # el tag es la fuente unica de version
          LDFLAGS="-s -w -X github.com/Shotafry/talos/internal/cli.version=$VERSION"
          echo "version: $VERSION"
          for tgt in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${tgt%/*}; arch=${tgt#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -buildvcs=false -ldflags "$LDFLAGS" -o "dist/talos-$os-$arch$ext" .
          done
          ( cd dist && sha256sum talos-* > SHA256SUMS )
      - name: Empaquetar catalogo (+ checksum que 'talos update' verifica)
        run: |
          tar -C internal/catalog -czf dist/catalog.tar.gz checks
          ( cd dist && sha256sum catalog.tar.gz > catalog.tar.gz.sha256 )
      - name: Publicar release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/talos-*
            dist/SHA256SUMS
            dist/catalog.tar.gz
            dist/catalog.tar.gz.sha256
